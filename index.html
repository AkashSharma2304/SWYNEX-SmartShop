<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShop - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <header>
            <a href="index.html" class="logo-link">
                <img src="logo.webp" alt="SmartShop Logo">
            </a>
        </header>

        <a href="cart.html" id="cartLink">Cart (0)</a>

        <div class="navigation-link">
            <a href="index.html">Home</a>
            <a href="#products">Products</a>
            <a href="#footer">About</a>
        </div>

        <!-- Search -->
        <form id="searchForm">
            <input type="search" id="searchbox" name="searchbox" placeholder="Search products...">
            <button type="submit">Search</button>
        </form>
    </nav>

    <!-- Main Layout -->
    <div class="page-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Categories</h2>
            <ul class="sidebar-categories">
                <!-- Categories will be generated by JavaScript -->
            </ul>
        </aside>

        <!-- Products -->
        <main class="main-content" id="products">
            <h2>All Products</h2>
            <p id="productCount">Loading products...</p>

            <!-- Sort -->
            <div class="sort-container">
                <label for="sort-by">Sort by:</label>
                <select name="sort-by" id="sort-by">
                    <option value="default" selected>Default</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="rating-desc">Rating: High to Low</option>
                </select>
            </div>

            <!-- Products are added here -->
            <div class="products-container"></div>
             <!-- Pagination -->
            <section class="pagination" id="pagination">
                <button type="button" id="prevPage">Previous</button>
                <div id="pageNumbers"></div>
                <button type="button" id="nextPage">Next</button>
            </section>

        </main>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <h3>SmartShop</h3>
        <p>Explore Products. Find What You Need.</p>
        <p>&copy; 2026 SmartShop. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
